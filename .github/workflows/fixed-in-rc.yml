# An issue a commit on rc fixes is labelled fixed-in-rc until it reaches
# main, where GitHub closes it. See .github/scripts/fixed_in_rc.py.
name: Label issues fixed on rc

on:
  push:
    branches: [rc]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label what rc fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fixed_in_rc.py
